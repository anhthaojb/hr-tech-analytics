# ==============================================================================
# .github/workflows/daily_etl.yml
# ==============================================================================

name: Daily ETL Pipeline

on:
  schedule:
    # Chạy lúc 8:00 SA giờ Việt Nam (UTC+7) = 01:00 UTC
    - cron: "0 1 * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "ETL mode"
        required: false
        default: "daily"
        type: choice
        options:
          - daily
          - full

env:
  DATABASE_URL:      ${{ secrets.DATABASE_URL }}
  GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
  SCRAPEOPS_API_KEY: ${{ secrets.SCRAPEOPS_API_KEY }}
  TYPESENSE_ENABLED: "false"
  PYTHONIOENCODING:  "utf-8"
  MODE: ${{ github.event.inputs.mode || 'daily' }}

jobs:
  etl:
    name: Run ETL Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ------------------------------------------------------------------
      # 1. Checkout code
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 2. Setup Python
      # ------------------------------------------------------------------
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ------------------------------------------------------------------
      # 3. Install dependencies
      # ------------------------------------------------------------------
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------------------
      # 4. Install Playwright browsers
      # FIX BUG 6: thêm sudo cho install-deps (Ubuntu CI yêu cầu)
      # ------------------------------------------------------------------
      - name: Install Playwright Chromium
        run: |
          playwright install chromium
          sudo playwright install-deps chromium

      # ------------------------------------------------------------------
      # 5. Chạy Scrapy spiders
      # FIX BUG 5: bỏ "cd jobscrapers" — chạy từ root để get_project_settings()
      #            tìm thấy scrapy.cfg ở root
      # ------------------------------------------------------------------
      - name: Run Scrapy spiders
        run: |
          echo "=========================================="
          echo " [2/3] Scrapy spiders | mode=$MODE"
          echo "=========================================="
          python run_spiders.py $MODE
        continue-on-error: true

      # ------------------------------------------------------------------
      # 6. Chạy ETL
      # FIX BUG 2: đường dẫn đúng là etl/etl_supabase.py
      # ------------------------------------------------------------------
      - name: Run ETL
        run: |
          echo "=========================================="
          echo " [3/3] ETL transform + Load DW | mode=$MODE"
          echo "=========================================="
          if [ "$MODE" = "full" ]; then
            python etl/etl_supabase.py --all
          else
            python etl/etl_supabase.py
          fi

      # ------------------------------------------------------------------
      # 7. Notify on failure
      # ------------------------------------------------------------------
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Pipeline FAILED — kiểm tra logs ở tab Actions"

# ==============================================================================
# .github/workflows/daily_etl.yml
#
# LUỒNG CHẠY:
#   Step 1 — Scrapy spiders          (headless Playwright, bỏ qua LinkedIn Selenium)
#   Step 2 — AI processor LinkedIn   (Groq LLM enrichment)
#   Step 3 — ETL transform + save    (etl_supabase.py — KHÔNG dedup, KHÔNG load DW)
#   Step 4 — Global Dedup            (dedup.py — quét toàn kho, gắn cờ is_duplicate)
#   Step 5 — Load Data Warehouse     (dedup.py gọi sp_etl_load_dw, hoặc chạy riêng)
#
# SECRETS cần thêm vào GitHub → Settings → Secrets and variables → Actions:
#   DATABASE_URL          postgresql+psycopg2://postgres:[PASS]@db.[REF].supabase.co:5432/postgres
#   GROQ_API_KEY          gsk_...
#   SCRAPEOPS_API_KEY     53cd5666-...
#   ITVIEC_EMAIL          (dùng cho spider itviec)
#   ITVIEC_PASSWORD       (dùng cho spider itviec)
# ==============================================================================

name: Daily ETL Pipeline

on:
  schedule:
    # Chạy lúc 8:00 SA giờ Việt Nam (UTC+7) = 01:00 UTC
    - cron: "0 1 * * *"

  # Chạy thủ công từ GitHub UI
  workflow_dispatch:
    inputs:
      mode:
        description: "ETL mode"
        required: false
        default: "daily"
        type: choice
        options:
          - daily
          - full

env:
  DATABASE_URL:      ${{ secrets.DATABASE_URL }}
  GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
  SCRAPEOPS_API_KEY: ${{ secrets.SCRAPEOPS_API_KEY }}
  TYPESENSE_ENABLED: "false"   # Typesense chạy localhost — không dùng được trên CI
  PYTHONIOENCODING:  "utf-8"
  MODE: ${{ github.event.inputs.mode || 'daily' }}

jobs:
  etl:
    name: Run ETL Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ------------------------------------------------------------------
      # 1. Checkout code
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 2. Setup Python
      # ------------------------------------------------------------------
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ------------------------------------------------------------------
      # 3. Install dependencies
      # ------------------------------------------------------------------
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------------------
      # 4. Install Playwright browsers
      # ------------------------------------------------------------------
      - name: Install Playwright Chromium
        run: |
          playwright install chromium --with-deps

      # ------------------------------------------------------------------
      # 5. [Spider] Scrapy spiders — LinkedIn Selenium BỎ QUA (cần GUI)
      # ------------------------------------------------------------------
      - name: Run Scrapy spiders
        env:
          ITVIEC_EMAIL:    ${{ secrets.ITVIEC_EMAIL }}
          ITVIEC_PASSWORD: ${{ secrets.ITVIEC_PASSWORD }}
        run: |
          echo "=========================================="
          echo " [1/4] Scrapy spiders | mode=$MODE"
          echo "=========================================="
          python run_spiders.py $MODE
        continue-on-error: true   # spider lỗi không block ETL

      # ------------------------------------------------------------------
      # 6. [AI] Enrichment LinkedIn bằng Groq LLM
      # ------------------------------------------------------------------
      - name: Run AI processor (LinkedIn staging)
        run: |
          echo "=========================================="
          echo " [2/4] AI processor LinkedIn"
          echo "=========================================="
          python etl/staging_linkedin.py

      # ------------------------------------------------------------------
      # 7. [ETL] Transform + Save fact — KHÔNG dedup, KHÔNG load DW
      #    ETL chỉ tập trung: load raw → transform → save fact_jobs_etl
      # ------------------------------------------------------------------
      - name: Run ETL (transform + save fact)
        run: |
          echo "=========================================="
          echo " [3/4] ETL transform + Save | mode=$MODE"
          echo "=========================================="
          if [ "$MODE" = "full" ]; then
            python etl/etl_supabase.py --all
          else
            python etl/etl_supabase.py
          fi

      # ------------------------------------------------------------------
      # 8. [Dedup] Quét trùng lặp TOÀN KHO + Load Data Warehouse
      #    - Reset toàn bộ is_duplicate cũ
      #    - Exact match + Fuzzy match trên 100% fact_jobs_etl
      #    - Gắn cờ is_duplicate / duplicate_of_id / dedup_method
      #    - Gọi sp_etl_load_dw('all', NULL) để đồng bộ DW
      # ------------------------------------------------------------------
      - name: Run Global Dedup + Load DW
        run: |
          echo "=========================================="
          echo " [4/4] Global Dedup + Load Data Warehouse"
          echo "=========================================="
          python etl/dedup.py

      # ------------------------------------------------------------------
      # 9. Notify on failure
      # ------------------------------------------------------------------
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Pipeline FAILED — kiểm tra logs ở tab Actions"
          # Thêm webhook Slack/email ở đây nếu muốn
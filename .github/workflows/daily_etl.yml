# ==============================================================================
# .github/workflows/daily_etl.yml
# Thay thế hoàn toàn run.bat + Windows Task Scheduler
#
# LUỒNG CHẠY (giống run.bat):
#   Step 1 — LinkedIn Selenium  ← BỎ QUA (cần GUI browser, không chạy được trên CI)
#   Step 2 — Scrapy spiders     ← CHẠY (headless Playwright OK trên Ubuntu)
#   Step 3 — ETL transform      ← CHẠY
#   Step 4 — Load DW            ← CHẠY (tích hợp trong etl_supabase.py)
#
# SECRETS cần thêm vào GitHub repo → Settings → Secrets and variables → Actions:
#   DATABASE_URL          postgresql+psycopg2://postgres:[PASS]@db.[REF].supabase.co:5432/postgres
#   GROQ_API_KEY          gsk_...
#   LINKEDIN_USERNAME     (dùng cho chạy local, không dùng trên CI)
#   LINKEDIN_PASSWORD     (dùng cho chạy local, không dùng trên CI)
#   SCRAPEOPS_API_KEY     53cd5666-...
# ==============================================================================

name: Daily ETL Pipeline

on:
  schedule:
    # Chạy lúc 8:00 SA giờ Việt Nam (UTC+7) = 01:00 UTC
    - cron: "0 1 * * *"

  # Cho phép chạy thủ công từ GitHub UI
  workflow_dispatch:
    inputs:
      mode:
        description: "ETL mode"
        required: false
        default: "daily"
        type: choice
        options:
          - daily
          - full

env:
  DATABASE_URL:      ${{ secrets.DATABASE_URL }}
  GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
  SCRAPEOPS_API_KEY: ${{ secrets.SCRAPEOPS_API_KEY }}
  TYPESENSE_ENABLED: "false"   # Typesense chạy localhost — không dùng được trên CI
  PYTHONIOENCODING:  "utf-8"
  MODE: ${{ github.event.inputs.mode || 'daily' }}

jobs:
  etl:
    name: Run ETL Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 120   # tối đa 2 tiếng

    steps:
      # ------------------------------------------------------------------
      # 1. Checkout code
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 2. Setup Python
      # ------------------------------------------------------------------
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ------------------------------------------------------------------
      # 3. Install dependencies
      # ------------------------------------------------------------------
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------------------
      # 4. Install Playwright browsers (Chromium cho Scrapy-Playwright)
      # ------------------------------------------------------------------
      - name: Install Playwright Chromium
        run: |
          playwright install chromium --with-deps

      # ------------------------------------------------------------------
      # 5. Chạy Scrapy spiders
      #    - Các spider dùng Playwright/HTTP đều chạy được trên Ubuntu
      #    - linkedin_selenium.py KHÔNG chạy ở đây (cần undetected-chromedriver + GUI)
      # ------------------------------------------------------------------
      - name: Run Scrapy spiders
        env:
          ITVIEC_EMAIL:    ${{ secrets.ITVIEC_EMAIL }}      # ← thêm
          ITVIEC_PASSWORD: ${{ secrets.ITVIEC_PASSWORD }}   # ← thêm
        run: |
          echo "=========================================="
          echo " [2/3] Scrapy spiders | mode=$MODE"
          echo "=========================================="
          python run_spiders.py $MODE
        continue-on-error: true   # spider lỗi không block ETL
      - name: Run AI processor (LinkedIn)
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python staging_linkedin.py


      # ------------------------------------------------------------------
      # 6. Chạy ETL (transform + dedup + load DW)
      # ------------------------------------------------------------------
      - name: Run ETL
        run: |
          echo "=========================================="
          echo " [3/3] ETL transform + Load DW | mode=$MODE"
          echo "=========================================="
          if [ "$MODE" = "full" ]; then
            python etl/etl_supabase.py --all
          else
            python etl/etl_supabase.py
          fi
      # ------------------------------------------------------------------
      # 7. Notify on failure (optional — xóa nếu không dùng)
      # ------------------------------------------------------------------
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Pipeline FAILED — kiểm tra logs ở tab Actions"
          # Thêm webhook Slack/email ở đây nếu muốn
